# Public entry point - ALL requests go through the API Gateway
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-registration
  ports:
    - port: 5005
      targetPort: 5005
      nodePort: 30005
---
# Internal service so the gateway (Pod 1) can reach Login (Pod 2)
apiVersion: v1
kind: Service
metadata:
  name: login-service
spec:
  type: ClusterIP
  selector:
    app: login
  ports:
    - port: 5004
      targetPort: 5004
